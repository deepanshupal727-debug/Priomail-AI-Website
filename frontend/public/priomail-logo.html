<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PrioMail AI — Logo Snippet</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07050f;font-family:Inter,Helvetica Neue,Arial,sans-serif}
</style>
</head>
<body>

<!-- ===================== PrioMail AI logo: paste from here ===================== -->
<style>
  .pm-stage{--logo-size:260px;display:inline-flex;flex-direction:column;align-items:center;gap:calc(var(--logo-size)*.18);user-select:none}
  .pm-card{position:relative;width:var(--logo-size);height:var(--logo-size);cursor:pointer;outline:none;transition:transform .3s cubic-bezier(.2,.9,.25,1.1)}
  .pm-card:active{transform:scale(.97)}
  .pm-capsule{position:relative;width:100%;height:100%;border-radius:calc(var(--logo-size)*.22);background:rgba(255,255,255,.015);box-shadow:inset 0 0 0 1px rgba(139,92,255,.18),inset 0 1px 0 rgba(255,255,255,.04),0 24px 50px -22px rgba(20,8,60,.55),0 0 40px -8px rgba(139,92,255,.18);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);overflow:hidden}
  .pm-bolt{position:absolute;top:50%;left:50%;width:32%;height:56%;transform:translate(-50%,-50%);overflow:visible}
  .pm-bolt-outline{fill:transparent}
  .pm-bolt-fill-live{opacity:0;animation:pm-fill-loop 2.4s ease-in-out infinite}
  @keyframes pm-fill-loop{0%,100%{opacity:0}50%{opacity:1}}
  .pm-card.is-pinged .pm-bolt-fill-live{animation:pm-fill-loop 2.4s ease-in-out infinite,pm-fill-ping .7s ease-out}
  @keyframes pm-fill-ping{0%,100%{filter:none}40%{filter:drop-shadow(0 0 18px rgba(181,148,255,.95)) brightness(1.4)}}
  .pm-wordmark{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-weight:700;letter-spacing:-.01em;font-size:calc(var(--logo-size)*.3);line-height:1;background:linear-gradient(180deg,#fff 0%,#f3eaff 55%,#c4a8ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px rgba(181,148,255,.45)) drop-shadow(0 2px 18px rgba(124,92,255,.25))}
  @media (prefers-reduced-motion:reduce){.pm-bolt-fill-live{animation:none;opacity:.6}}
</style>

<div class="pm-stage" role="img" aria-label="PrioMail AI">
  <div class="pm-card" onclick="this.classList.add('is-pinged');setTimeout(()=>this.classList.remove('is-pinged'),900)">
    <div class="pm-capsule">
      <svg class="pm-bolt" viewBox="0 0 100 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="pmBoltStroke" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#b594ff"/>
            <stop offset="100%" stop-color="#7c5cff"/>
          </linearGradient>
          <linearGradient id="pmBoltFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b594ff"/>
            <stop offset="100%" stop-color="#7c5cff"/>
          </linearGradient>
        </defs>
        <path class="pm-bolt-outline" d="M58 8 L24 86 L46 86 L40 152 L78 70 L54 70 L58 8 Z"
              stroke="url(#pmBoltStroke)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        <path class="pm-bolt-fill-live" d="M58 8 L24 86 L46 86 L40 152 L78 70 L54 70 L58 8 Z"
              fill="url(#pmBoltFill)"/>
      </svg>
    </div>
  </div>
  <div class="pm-wordmark">PrioMail AI</div>
</div>
<!-- ===================== PrioMail AI logo: paste to here ===================== -->

</body>
</html>
