<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PrioMail AI">
  <defs>
    <linearGradient id="capBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1330"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="boltStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b594ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="boltFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b594ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square capsule -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#capBg)"
        stroke="rgba(139,92,255,0.25)" stroke-width="2"/>
  <!-- inner top sheen -->
  <rect x="32" y="32" width="448" height="80" rx="112" ry="112" fill="rgba(255,255,255,0.03)"/>

  <!-- Bolt (filled with violet to represent the "alive" state) -->
  <g transform="translate(176 110) scale(1.6)" filter="url(#boltGlow)">
    <path d="M58 8 L24 86 L46 86 L40 152 L78 70 L54 70 L58 8 Z"
          fill="url(#boltFill)"
          stroke="url(#boltStroke)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
