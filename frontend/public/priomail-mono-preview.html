<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PrioMail mono variants</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;color:#fff}
.row{display:grid;grid-template-columns:repeat(3,1fr);min-height:100vh}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:20px}
.dark{background:#0d0820}
.light{background:#ffffff;color:#222}
.violet{background:#7c5cff}
img{width:200px;height:200px}
p{font-size:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin:0}
small{opacity:.6;font-size:11px}
</style></head><body>
<div class="row">
  <div class="cell dark">
    <img src="/priomail-icon-white-512.png">
    <p>White outline</p>
    <small>for dark backgrounds</small>
  </div>
  <div class="cell light">
    <img src="/priomail-icon-black-512.png">
    <p>Black outline</p>
    <small>for light backgrounds &amp; print</small>
  </div>
  <div class="cell violet">
    <img src="/priomail-icon-white-chip-512.png">
    <p>White chip</p>
    <small>for coloured / photo backgrounds</small>
  </div>
</div>
</body></html>
